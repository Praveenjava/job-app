<div class="container mt-5 card p-4 shadow-lg rounded-4">
    <h3 class="mb-4">Join Our Team</h3>
  
    <form [formGroup]="jobForm" (ngSubmit)="submitForm()">
  
      <div class="row">
        <div class="col-md-6">
          <input class="form-control mb-3" placeholder="Full Name"
            formControlName="fullName">
        </div>
  
        <div class="col-md-6">
          <input class="form-control mb-3" placeholder="Email"
            formControlName="email">
        </div>
      </div>
  
      <div class="row">
        <div class="col-md-6">
          <input class="form-control mb-3" placeholder="Phone"
            formControlName="phone">
        </div>
  
        <div class="col-md-6">
          <input class="form-control mb-3" placeholder="Location"
            formControlName="location">
        </div>
      </div>
  
      <input class="form-control mb-3" placeholder="Position"
        formControlName="position">
  
      <div class="row">
        <div class="col-md-6">
          <select class="form-control mb-3" formControlName="experience">
            <option value="">Experience</option>
            <option>Fresher</option>
            <option>1-3 Years</option>
          </select>
        </div>
  
        <div class="col-md-6">
          <select class="form-control mb-3" formControlName="education">
            <option value="">Education</option>
            <option>Bachelor</option>
            <option>Master</option>
          </select>
        </div>
      </div>
  
      <input class="form-control mb-3" placeholder="Skills"
        formControlName="skills">
  
      <textarea class="form-control mb-3"
        placeholder="Cover Letter"
        formControlName="coverLetter"></textarea>
  
      <input type="file" class="form-control mb-3"
        (change)="onFileChange($event)">
  
      <div class="form-check mb-3">
        <input type="checkbox" formControlName="relocate"
          class="form-check-input">
        <label>Willing to relocate</label>
      </div>
  
      <button class="btn btn-primary w-100"
        [disabled]="jobForm.invalid">
        Submit Application
      </button>
    </form>
  </div>
